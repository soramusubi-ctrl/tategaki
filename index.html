<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>縦読みの部屋</title><style>:root{--bg:#f4efe4;--paper:#fffdf7;--ink:#2f2a24;--muted:#7e7569;--line:#d9d0c4;--accent:#8a5d3b;--fs:22px;--lh:2.05}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.panel{height:100vh;overflow:auto;padding:24px;border-right:1px solid var(--line);background:#ffffff90}h1{margin:0;font-size:24px}.sub,.hint{margin:4px 0 18px;color:var(--muted);font-size:12px}label{display:block;margin:14px 0 6px;font-size:13px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}textarea{min-height:240px;resize:vertical;line-height:1.7}.row,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{margin-top:14px}button{padding:10px 14px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}.readerWrap{height:100vh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.reader{flex:1;overflow:auto;padding:42px 46px;background:var(--paper)}article{writing-mode:vertical-rl;text-orientation:mixed;white-space:pre-wrap;font-size:var(--fs);line-height:var(--lh);letter-spacing:.04em;height:calc(100vh - 142px);margin-left:auto}article h2{font-size:1.45em;margin:0 0 0 2.5rem}.empty{padding-top:20vh;text-align:center;color:var(--muted);font-family:system-ui,sans-serif}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--paper);opacity:0;transition:.2s}.toast.show{opacity:1}.readonly .panel{display:none}.readonly .app{grid-template-columns:1fr}.night{--bg:#161514;--paper:#201e1b;--ink:#eee7dc;--muted:#aaa095;--line:#3a3631}.blue{--bg:#eaf0f1;--paper:#f8fbfb;--ink:#26363a;--muted:#718287;--line:#ccd9dc}.sakura{--bg:#f6ecef;--paper:#fffafb;--ink:#402f36;--muted:#8a737b;--line:#e4d2d8}@media(max-width:850px){.app{grid-template-columns:1fr}.panel{height:auto;border-right:0;border-bottom:1px solid var(--line)}.readerWrap{height:75vh}article{height:calc(75vh - 118px);min-height:360px}.readonly .readerWrap{height:100vh}.readonly article{height:calc(100vh - 110px)}}</style></head><body><div class="app"><aside class="panel"><h1>縦読みの部屋</h1><div class="sub">Substackの物語を、縦にほどく。</div><label>作品タイトル</label><input id="title" placeholder="雨宿り、営業中"><label>本文</label><textarea id="body" placeholder="本文を貼り付けてください。"></textarea><label>Substackの記事URL</label><input id="source" placeholder="https://example.substack.com/p/..."><div class="buttons"><button id="render">縦書きで読む</button><button class="ghost" id="localSave">作品を保存</button></div><div class="buttons"><button id="publish">共有リンクを作る</button><button class="ghost" id="copy" disabled>リンクをコピー</button></div><div class="row"><div><label>背景</label><select id="theme"><option value="">生成り</option><option value="blue">水色</option><option value="sakura">桜</option><option value="night">夜</option></select></div><div><label>書体</label><select id="font"><option value="serif">明朝</option><option value="sans">ゴシック</option></select></div></div><label>文字サイズ <span id="sv">22</span>px</label><input id="size" type="range" min="16" max="34" value="22"><label>行間 <span id="lv">2.05</span></label><input id="line" type="range" min="1.4" max="2.8" step="0.05" value="2.05"><p class="hint">共有時は本文を保存し、短い作品IDだけをURLに載せます。</p></aside><main class="readerWrap"><div class="top"><span id="header">まだ何も置かれていません。</span><button class="ghost" id="full">全画面</button></div><section class="reader" id="reader"><div class="empty">左に本文を置いて、「縦書きで読む」を押してください。</div></section></main></div><div class="toast" id="toast"></div><script>const $=s=>document.querySelector(s),reader=$('#reader'),root=document.documentElement;let shareUrl='';function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function data(){return{title:$('#title').value.trim()||'無題',body:$('#body').value,source:$('#source').value.trim(),theme:$('#theme').value,font:$('#font').value,size:$('#size').value,line:$('#line').value}}function setData(d){$('#title').value=d.title||'';$('#body').value=d.body||'';$('#source').value=d.source||'';$('#theme').value=d.theme||'';$('#font').value=d.font||'serif';$('#size').value=d.size||22;$('#line').value=d.line||2.05;apply();render()}function apply(){document.body.className=(location.pathname.startsWith('/s/')?'readonly ':'')+$('#theme').value;root.style.setProperty('--fs',$('#size').value+'px');root.style.setProperty('--lh',$('#line').value);$('#sv').textContent=$('#size').value;$('#lv').textContent=$('#line').value;reader.style.fontFamily=$('#font').value==='sans'?'Yu Gothic,Hiragino Kaku Gothic ProN,sans-serif':'Yu Mincho,Hiragino Mincho ProN,serif'}function render(){const d=data();$('#header').textContent=d.title;if(!d.body.trim()){reader.innerHTML='<div class="empty">本文が空です。</div>';return}reader.innerHTML='';const a=document.createElement('article'),h=document.createElement('h2'),b=document.createElement('div');h.textContent=d.title;b.textContent=d.body;a.append(h,b);reader.append(a);reader.scrollLeft=reader.scrollWidth}async function publish(){const d=data();if(!d.body.trim())return toast('本文が空です');toast('共有ページを作っています');try{const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw new Error(j.error||'保存失敗');shareUrl=location.origin+'/s/'+j.id;$('#copy').disabled=false;await navigator.clipboard.writeText(shareUrl);toast('短い共有リンクをコピーしました')}catch(e){toast(e.message||'共有に失敗しました')}}async function loadShared(){const m=location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)$/);if(!m)return;reader.innerHTML='<div class="empty">物語を読み込んでいます。</div>';try{const r=await fetch('/api/story?id='+encodeURIComponent(m[1])),j=await r.json();if(!r.ok)throw new Error(j.error||'読込失敗');setData(j.story)}catch(e){reader.innerHTML='<div class="empty">この物語は見つかりませんでした。</div>'}}$('#render').onclick=render;$('#localSave').onclick=()=>{localStorage.setItem('tategaki-current',JSON.stringify(data()));toast('この端末に保存しました')};$('#publish').onclick=publish;$('#copy').onclick=async()=>{if(shareUrl){await navigator.clipboard.writeText(shareUrl);toast('コピーしました')}};$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();['theme','font','size','line'].forEach(id=>$('#'+id).oninput=()=>{apply();render()});if(!location.pathname.startsWith('/s/')){try{const d=JSON.parse(localStorage.getItem('tategaki-current')||'null');if(d)setData(d)}catch(e){}apply()}loadShared();</script></body></html>
