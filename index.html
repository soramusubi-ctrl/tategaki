<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>縦読みの部屋</title><style>:root{--bg:#f4efe4;--paper:#fffdf7;--ink:#2f2a24;--muted:#7e7569;--line:#d9d0c4;--fs:22px;--lh:2.05}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.panel{height:100vh;overflow:auto;padding:24px;border-right:1px solid var(--line);background:#ffffff90}h1{margin:0;font-size:24px}.sub{margin:4px 0 18px;color:var(--muted);font-size:12px}label{display:block;margin:14px 0 6px;font-size:13px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}textarea{min-height:240px;resize:vertical;line-height:1.7}.row,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{margin-top:14px}button{padding:10px 14px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}.readerWrap{height:100vh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.reader{flex:1;overflow:auto;padding:42px 46px;background:var(--paper)}article{writing-mode:vertical-rl;text-orientation:mixed;white-space:pre-wrap;font-size:var(--fs);line-height:var(--lh);letter-spacing:.04em;height:calc(100vh - 142px);margin-left:auto}article h2{font-size:1.45em;margin:0 0 0 2.5rem}.empty{padding-top:20vh;text-align:center;color:var(--muted);font-family:system-ui,sans-serif}.night{--bg:#161514;--paper:#201e1b;--ink:#eee7dc;--muted:#aaa095;--line:#3a3631}.blue{--bg:#eaf0f1;--paper:#f8fbfb;--ink:#26363a;--muted:#718287;--line:#ccd9dc}.sakura{--bg:#f6ecef;--paper:#fffafb;--ink:#402f36;--muted:#8a737b;--line:#e4d2d8}@media(max-width:850px){.app{grid-template-columns:1fr}.panel{height:auto;border-right:0;border-bottom:1px solid var(--line)}.readerWrap{height:75vh}article{height:calc(75vh - 118px);min-height:360px}}</style></head><body><div class="app"><aside class="panel"><h1>縦読みの部屋</h1><div class="sub">Substackの物語を、縦にほどく。</div><label>作品タイトル</label><input id="title" placeholder="雨宿り、営業中"><label>本文</label><textarea id="body" placeholder="本文を貼り付けてください。"></textarea><label>Substackの記事URL</label><input id="source" placeholder="https://example.substack.com/p/..."><div class="buttons"><button id="render">縦書きで読む</button><button class="ghost" id="save">作品を保存</button></div><div class="row"><div><label>背景</label><select id="theme"><option value="">生成り</option><option value="blue">水色</option><option value="sakura">桜</option><option value="night">夜</option></select></div><div><label>書体</label><select id="font"><option value="serif">明朝</option><option value="sans">ゴシック</option></select></div></div><label>文字サイズ <span id="sv">22</span>px</label><input id="size" type="range" min="16" max="34" value="22"><label>行間 <span id="lv">2.05</span></label><input id="line" type="range" min="1.4" max="2.8" step="0.05" value="2.05"></aside><main class="readerWrap"><div class="top"><span id="header">まだ何も置かれていません。</span><button class="ghost" id="full">全画面</button></div><section class="reader" id="reader"><div class="empty">左に本文を置いて、「縦書きで読む」を押してください。</div></section></main></div><script>const $=s=>document.querySelector(s),reader=$('#reader'),root=document.documentElement;function data(){return{title:$('#title').value.trim()||'無題',body:$('#body').value,source:$('#source').value.trim(),theme:$('#theme').value,font:$('#font').value,size:$('#size').value,line:$('#line').value}}function apply(){document.body.className=$('#theme').value;root.style.setProperty('--fs',$('#size').value+'px');root.style.setProperty('--lh',$('#line').value);$('#sv').textContent=$('#size').value;$('#lv').textContent=$('#line').value;reader.style.fontFamily=$('#font').value==='sans'?'Yu Gothic,Hiragino Kaku Gothic ProN,sans-serif':'Yu Mincho,Hiragino Mincho ProN,serif'}function render(){const d=data();$('#header').textContent=d.title;if(!d.body.trim()){reader.innerHTML='<div class="empty">本文が空です。</div>';return}reader.innerHTML='';const a=document.createElement('article'),h=document.createElement('h2'),b=document.createElement('div');h.textContent=d.title;b.textContent=d.body;a.append(h,b);reader.append(a);reader.scrollLeft=reader.scrollWidth}$('#render').onclick=render;$('#save').onclick=()=>localStorage.setItem('tategaki-current',JSON.stringify(data()));$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();['theme','font','size','line'].forEach(id=>$('#'+id).oninput=()=>{apply();render()});try{const d=JSON.parse(localStorage.getItem('tategaki-current')||'null');if(d){$('#title').value=d.title||'';$('#body').value=d.body||'';$('#source').value=d.source||'';$('#theme').value=d.theme||'';$('#font').value=d.font||'serif';$('#size').value=d.size||22;$('#line').value=d.line||2.05}}catch(e){}apply();</script></body></html>
